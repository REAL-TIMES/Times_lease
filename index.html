<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TIMES 임대 매물 관리</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin:0; font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif; background:#f7f4ef; color:#1a1a2e; -webkit-font-smoothing:antialiased; }
    input,textarea,select,button { font-family:inherit; box-sizing:border-box; }
    .print-only  { display:none !important; }
    .screen-only { display:block; }
    @media print {
      .no-print    { display:none !important; }
      .print-only  { display:block !important; }
      .screen-only { display:none !important; }
      body { background:white; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="./app.js"></script>
</body>
</html>
